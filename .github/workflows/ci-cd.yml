name: ResumeAI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-node-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Django Tests
      env:
        SECRET_KEY: 'ci-cd-test-secret-key-placeholder-for-django'
        DEBUG: 'True'
      run: |
        cd backend
        pytest --cov-config=.coveragerc --cov=. --cov-fail-under=80

  test-frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Run Vitest Suite
      run: |
        cd frontend
        npx vitest run

    - name: Build React App
      run: |
        cd frontend
        npm run build

  build-docker-images:
    name: Docker Builds Verification
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v2

    - name: Build Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: resumeai-backend:latest

    - name: Build Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: resumeai-frontend:latest

    - name: Build Nginx Ingress Image
      uses: docker/build-push-action@v4
      with:
        context: ./nginx
        file: ./nginx/Dockerfile
        push: false
        tags: resumeai-nginx:latest
